# Deploys main to https://studio.kriviinfotech.com — docs/DEPLOYMENT.md, "Automatic deploy".
# The host builds from its own git clone; this job starts it (optionally), waits for it, puts back
# the web.config the host breaks, and fails unless the live build becomes this commit.
# No secret is in this file: both come from the repository's Actions secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of racing it on web.config.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Deploy, repair web.config, verify
        env:
          STUDIOCRM_DEPLOY_HOOK: ${{ secrets.STUDIOCRM_DEPLOY_HOOK }}
          STUDIOCRM_FTP_PASSWORD: ${{ secrets.STUDIOCRM_FTP_PASSWORD }}
          # When GitHub delivered the push (and its webhook started the host): used to find this
          # run's host deploy log. Empty on a manual run, where the script uses its own start time.
          DEPLOY_T0: ${{ github.event.repository.pushed_at }}
          DEADLINE_MIN: '30'
        run: bash deploy/ci-deploy.sh
