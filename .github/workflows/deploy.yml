# Deploys main to https://studio.kriviinfotech.com — docs/DEPLOYMENT.md, "Automatic deploy".
# Every push to main: install, typecheck, test, build HERE, then upload the built server over FTPS
# and restart it (deploy/ci-deploy.sh). The host's own git build is not used — it is slow and
# breaks web.config. A failing typecheck or test stops the deploy; the site keeps the old build.
# No secret is in this file: the FTP password comes from the repository's Actions secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of uploading over it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm typecheck && pnpm test

      - name: Build
        run: BUILD_COMMIT="${GITHUB_SHA::7}" pnpm build

      # Tests run the TypeScript source; this starts the BUNDLE that will be uploaded. A bundle that
      # cannot start (19f1cbf: a duplicate top-level import) would otherwise take the live site down.
      - name: Start the built server
        run: |
          PORT=4999 NODE_ENV=production JWT_SECRET=ci-smoke-only DATABASE_URL=postgres://ci:ci@127.0.0.1:1/none \
            node apps/api/dist/server.js > smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -s -m 2 http://127.0.0.1:4999/api/health | grep -qF "\"version\":\"${GITHUB_SHA::7}\""; then
              echo "built server starts and answers as ${GITHUB_SHA::7}"; kill $pid; exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the built server did not start, so nothing was uploaded; the site keeps the previous build"
          tail -n 30 smoke.log; exit 1

      - name: Upload to the site, restart, verify
        env:
          STUDIOCRM_FTP_PASSWORD: ${{ secrets.STUDIOCRM_FTP_PASSWORD }}
        run: bash deploy/ci-deploy.sh
