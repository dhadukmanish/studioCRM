# Deploys main to https://studio.kriviinfotech.com — docs/DEPLOYMENT.md, "Automatic deploy".
# Every push to main: install, typecheck, test, build HERE, then upload the built server over FTPS
# and restart it (deploy/ci-deploy.sh). The host's own git build is not used — it is slow and
# breaks web.config. A failing typecheck or test stops the deploy; the site keeps the old build.
# No secret is in this file: the FTP password comes from the repository's Actions secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of uploading over it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm typecheck && pnpm test

      - name: Build
        run: BUILD_COMMIT="${GITHUB_SHA::7}" pnpm build

      - name: Upload to the site, restart, verify
        env:
          STUDIOCRM_FTP_PASSWORD: ${{ secrets.STUDIOCRM_FTP_PASSWORD }}
        run: bash deploy/ci-deploy.sh
